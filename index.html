        <style>
        :root { --primary:#5B21B6; --accent:#84CC16; --bg:#F1F5F9; --surface:#FFF; --border:#E2E8F0; --text-main:#0F172A; --text-muted:#64748B; --radius:12px; }

        .admin-tabs{display:flex; gap:5px; background:#F1F5F9; padding:7px 9px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
        .admin-tab-btn{padding:6px 10px; border:none; background:#E2E8F0; border-radius:6px; cursor:pointer; font-weight:700; color:#475569; font-size:0.8rem; display:flex; align-items:center; gap:4px;} .admin-tab-btn.active{background:var(--primary); color:white;}
        .admin-tab-panel{display:none; padding:9px; overflow-y:auto; flex:1;} .admin-tab-panel.active{display:block;}
        .admin-dash-body{flex:1; overflow-y:auto; background:var(--bg); display:flex; flex-direction:column;}
        #loadingOverlay{position:fixed; inset:0; background:var(--bg); z-index:3000; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px} #loadingOverlay.hidden{display:none} .spinner{width:38px; height:38px; border:4px solid #DDD6FE; border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}
        #toastContainer{position:fixed; bottom:16px; inset-inline-end:16px; z-index:4000; display:flex; flex-direction:column; gap:6px; max-width:300px} .toast{padding:10px 12px; border-radius:8px; font-weight:700; font-size:0.8rem; color:white; display:flex; align-items:center; gap:6px} .toast.success{background:#16A34A} .toast.error{background:#DC2626} .toast.info{background:#334155}
        .search-box{position:relative; margin:0.5rem 0} .search-box input{padding:7px 30px; border:1px solid var(--border); border-radius:7px; width:100%; font-size:0.82rem; background:#FAFAFA} .search-box i{position:absolute; top:50%; transform:translateY(-50%); inset-inline-start:9px; color:var(--text-muted)}
        .quick-actions{display:flex; gap:5px; flex-wrap:wrap} .filter-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:5px; margin-top:5px} .filter-grid input, .filter-grid select{padding:6px 8px; border:1px solid var(--border); border-radius:6px; font-size:0.8rem; background:var(--surface)}
        .thermal-card-sticky{position:sticky; top:4.8rem;} @media (max-width:992px){.thermal-card-sticky{position:relative; top:0}}
        @media print{
            @page{size:80mm auto; margin:0mm}

            .container{margin:0; padding:0; max-width:100%}

<script>
}
function saveInvoiceDraft(){const s=invoiceFormSnapshot(); const meaningful=s.staff||s.service||s.duration||s.price; if(!meaningful) return; localStorage.setItem(DRAFT_KEY,JSON.stringify(s));}
function restoreInvoiceDraft(){try{const raw=localStorage.getItem(DRAFT_KEY); if(!raw) return; const draft=JSON.parse(raw); const set=(id,v)=>{const el=document.getElementById(id); if(el&&v!==undefined) el.value=v;}; set('invDateInput',draft.date||getLocalDate()); set('staffSelect',draft.staff); set('serviceSelect',draft.service); set('duration',draft.duration); set('price',draft.price); set('paymentMethod',draft.pay); set('serviceLocation',draft.location); document.getElementById('draftNotice')?.classList.add('active'); updateLivePreview();}catch(e){localStorage.removeItem(DRAFT_KEY);}}
function clearInvoiceDraft(showMessage=true){localStorage.removeItem(DRAFT_KEY); document.getElementById('draftNotice')?.classList.remove('active'); if(showMessage) showToast(tr('discardDraft'),'info');}
function attachDraftAutosave(){const form=document.getElementById('invoiceForm'); if(!form||form.dataset.draftBound) return; form.dataset.draftBound='1'; form.addEventListener('input',()=>{clearTimeout(draftTimer); draftTimer=setTimeout(saveInvoiceDraft,250);}); form.addEventListener('change',saveInvoiceDraft);}
function populateStaffSelect(){const select=document.getElementById('staffSelect'); const prev=select.value; select.innerHTML=''; staffList.filter(s=>s.active).forEach(s=>{const opt=document.createElement('option'); opt.value=s.id; opt.textContent=staffDisplayName(s); select.appendChild(opt);}); if([...select.options].some(o=>o.value===prev)) select.value=prev; updateLivePreview();}
function populateServiceSelect(){const select=document.getElementById('serviceSelect'); select.innerHTML=''; servicesList.filter(s=>s.active).forEach(s=>{const opt=document.createElement('option'); opt.value=s.id; opt.textContent=`${serviceDisplayName(s)} (${s.price} ${currentLang==='ar'?'ر.س':'SAR'})`; opt.dataset.price=s.price; select.appendChild(opt);}); onServiceSelectChange();}
function onServiceSelectChange(){const select=document.getElementById('serviceSelect'); const opt=select.options[select.selectedIndex]; if(opt&&opt.dataset.price) document.getElementById('price').value=opt.dataset.price; updateLivePreview();}
function setDuration(mins){document.getElementById('duration').value=mins; updateLivePreview();}
function renderBarcode(id,val){try{if(typeof JsBarcode!=='function') return; if(!val) val='0'; JsBarcode('#'+id,String(val),{format:'CODE128', displayValue:true, fontSize:12, height:38, width:1.4, margin:2, background:'#ffffff', lineColor:'#000000'});}catch(e){}}
function updateLivePreview(){const now=new Date(); document.getElementById('r-date').innerText=formatDate(document.getElementById('invDateInput').value); document.getElementById('r-serial').innerText=document.getElementById('invSerial').value; document.getElementById('r-time').innerText=now.toLocaleTimeString(currentLang==='ar'?'ar-SA':'en-US',{hour:'2-digit',minute:'2-digit'}); const staff=findStaffById(document.getElementById('staffSelect').value); document.getElementById('r-staff').innerText=staff?staffDisplayName(staff):'--'; const service=findServiceById(document.getElementById('serviceSelect').value); document.getElementById('r-service').innerText=service?serviceDisplayName(service):'--'; const durationVal=document.getElementById('duration').value; document.getElementById('r-duration').innerText=durationVal?`${durationVal} ${tr('minutes')}`:'--'; document.getElementById('r-type').innerText=locationLabel(document.getElementById('serviceLocation').value); document.getElementById('r-pay').innerText=payLabel(document.getElementById('paymentMethod').value); const price=document.getElementById('price').value||0; document.getElementById('r-price').innerText=Number(price).toFixed(2)+(currentLang==='ar'?' ر.س':' SAR'); renderBarcode('barcodeSvg',document.getElementById('invSerial').value);}
async function saveInvoice(e){e.preventDefault(); const priceCheck=Number(document.getElementById('price').value); if(isNaN(priceCheck)||priceCheck<=0){showToast(tr('invalidAmount'),'error'); return;} const saveBtn=document.getElementById('saveBtn'); saveBtn.disabled=true; const now=new Date(); const staffId=document.getElementById('staffSelect').value; const serviceId=document.getElementById('serviceSelect').value; const staff=findStaffById(staffId); const service=findServiceById(serviceId); const price=Number(document.getElementById('price').value); const serviceLocation=document.getElementById('serviceLocation').value; const commission=calculateWorkerCommission(serviceLocation,price,staffId); const newInv={date:document.getElementById('invDateInput').value, time:now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}), staff_id:staffId||null, staff:staff?staff.name_ar:'', service_id:serviceId||null, service:service?service.name_ar:'', duration:document.getElementById('duration').value, price:price, commission:commission, pay:document.getElementById('paymentMethod').value, service_location:serviceLocation}; const {data,error}=await _supabase.from('invoices').insert([newInv]).select(); saveBtn.disabled=false; if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} const saved=data[0]; if(!invoices.find(i=>i.id===saved.id)) invoices.push(mapInvoiceRow(saved)); clearInvoiceDraft(false); document.getElementById('r-serial').innerText=saved.serial||('INV-'+String(saved.id).padStart(5,'0')); document.getElementById('invSerial').value=saved.serial||('INV-'+String(saved.id).padStart(5,'0')); renderBarcode('barcodeSvg',document.getElementById('invSerial').value); printElement('thermal-receipt'); document.getElementById('invoiceForm').reset(); document.getElementById('invDateInput').value=getLocalDate(); document.getElementById('invSerial').value='—'; populateStaffSelect(); populateServiceSelect(); updateLivePreview(); renderReports(); renderCash(); showToast(tr('savedOk'),'success');}
function openEditModalProtected(type,id){ if(type==='invoice'){ requestManagerAuth(()=>openEditModal(type,id),'تعديل الفاتورة بعد الإصدار يتطلب صلاحية المدير'); } else { openEditModal(type,id); } }
function deleteInvoice(id){ requestManagerAuth(async()=>{ if(!confirm(tr('confirmDeleteInvoice'))) return; const {error}=await _supabase.from('invoices').delete().eq('id',id); if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} invoices=invoices.filter(i=>i.id!==id); renderReports(); renderCash(); showToast('تم حذف الفاتورة','success'); },'حذف الفاتورة يتطلب صلاحية المدير'); }
async function saveExpense(e){e.preventDefault(); const amountCheck=Number(document.getElementById('expAmount').value); if(isNaN(amountCheck)||amountCheck<=0){showToast(tr('invalidAmount'),'error'); return;} const btn=e.target.querySelector('button[type="submit"]'); if(btn) btn.disabled=true; const newExp={title:document.getElementById('expTitle').value, amount:Number(document.getElementById('expAmount').value), date:document.getElementById('expDateInput').value}; const {data,error}=await _supabase.from('expenses').insert([newExp]).select(); if(btn) btn.disabled=false; if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} if(data&&data[0]&&!expenses.find(e2=>e2.id===data[0].id)) expenses.push(mapExpenseRow(data[0])); document.getElementById('expenseForm').reset(); document.getElementById('expDateInput').value=getLocalDate(); renderExpenses(); renderReports(); renderCash(); showToast(tr('savedOk'),'success');}
function deleteExpense(id){ requestManagerAuth(async()=>{ if(!confirm(tr('confirmDeleteExpense'))) return; const {error}=await _supabase.from('expenses').delete().eq('id',id); if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} expenses=expenses.filter(e=>e.id!==id); renderExpenses(); renderReports(); renderCash(); },'حذف المصروف يتطلب صلاحية المدير'); }
function renderExpenses(){const tbody=document.getElementById('expensesTableBody'); tbody.innerHTML=''; const searchEl=document.getElementById('expenseSearchInput'); const q=searchEl?searchEl.value.trim().toLowerCase():''; const list=q?expenses.filter(ex=>(ex.title||'').toLowerCase().includes(q)):expenses; if(list.length===0){tbody.innerHTML=`<tr class="empty-row"><td colspan="4">${tr('noExpenses')}</td></tr>`; return;} [...list].sort((a,b)=>b.id-a.id).forEach(ex=>{const tr_=document.createElement('tr'); tr_.innerHTML=`<td>${formatDate(ex.date)}</td><td>${escapeHtml(ex.title)}</td><td>${ex.amount.toFixed(2)} SAR</td><td class="action-cell"><button class="btn btn-edit" onclick="openEditModal('expense',${'${ex.id}'})"><i class="fa-solid fa-pen"></i> ${tr('editBtn')}</button><button class="btn btn-danger" onclick="deleteExpense(${ex.id})"><i class="fa-solid fa-trash"></i></button></td>`; tbody.appendChild(tr_);});}
function populateReportStaffFilter(){const select=document.getElementById('reportStaffFilter'); if(!select) return; const previous=select.value; select.innerHTML=`<option value="">${tr('allStaff')}</option>`; staffList.forEach(s=>{const option=document.createElement('option'); option.value=s.id; option.textContent=staffDisplayName(s); select.appendChild(option);}); if([...select.options].some(option=>option.value===previous)) select.value=previous;}
function clearReportFilter(){['reportDateFilter','reportDateTo','reportStaffFilter','reportPayFilter','reportLocationFilter'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';}); renderReports();}
function setReportPeriod(period){const from=document.getElementById('reportDateFilter'); const to=document.getElementById('reportDateTo'); if(!from||!to) return; const today=new Date(); let start=new Date(today); if(period==='week'){start.setDate(today.getDate()-today.getDay());} else if(period==='month'){start=new Date(today.getFullYear(),today.getMonth(),1);} from.value=dateToInputValue(start); to.value=period==='today'?from.value:getLocalDate(); renderReports();}
function getReportFilteredData(){const filterDate=document.getElementById('reportDateFilter')?.value||''; const filterTo=document.getElementById('reportDateTo')?.value||''; const filterStaff=document.getElementById('reportStaffFilter')?.value||''; const filterPay=document.getElementById('reportPayFilter')?.value||''; const filterLocation=document.getElementById('reportLocationFilter')?.value||''; const inDateRange=date=>{if(filterDate&&!filterTo) return date===filterDate; if(filterDate&&date<filterDate) return false; if(filterTo&&date>filterTo) return false; return true;}; return {invoices:invoices.filter(i=>inDateRange(i.date)&&(!filterStaff||String(i.staffId)===String(filterStaff))&&(!filterPay||i.pay===filterPay)&&(!filterLocation||i.serviceLocation===filterLocation)), expenses:expenses.filter(e=>inDateRange(e.date))};}
function invoiceCommission(inv){return calculateWorkerCommission(inv.serviceLocation,inv.price,inv.staffId);}
function renderReports(){const reportData=getReportFilteredData(); const filteredInvoices=reportData.invoices; const filteredExpenses=reportData.expenses; const totalRev=filteredInvoices.reduce((sum,i)=>sum+i.price,0); const totalExp=filteredExpenses.reduce((sum,e)=>sum+e.amount,0); const totalCash=filteredInvoices.filter(i=>i.pay==='cash').reduce((sum,i)=>sum+i.price,0); let totalStaffComm=0; const staffMap={}; filteredInvoices.forEach(inv=>{const comm=invoiceCommission(inv); totalStaffComm+=comm; const key=inv.staffId!=null?String(inv.staffId):('legacy:'+inv.staffName); if(!staffMap[key]){const s=findStaffById(inv.staffId); staffMap[key]={label:s?staffDisplayName(s):(inv.staffName||'--'), count:0, sales:0, commission:0};} staffMap[key].count+=1; staffMap[key].sales+=inv.price; staffMap[key].commission+=comm;}); const netRev=totalRev-totalStaffComm-totalExp; const cur='SAR'; document.getElementById('totalRevenue').innerText=totalRev.toFixed(2)+' '+cur; document.getElementById('totalStaffCommission').innerText=totalStaffComm.toFixed(2)+' '+cur; document.getElementById('totalExpensesMetric').innerText=totalExp.toFixed(2)+' '+cur; document.getElementById('netRevenueMetric').innerText=netRev.toFixed(2)+' '+cur; document.getElementById('totalCash').innerText=totalCash.toFixed(2)+' '+cur; const staffPerfBody=document.getElementById('staffPerformanceBody'); const staffEntries=Object.values(staffMap); if(staffEntries.length===0){staffPerfBody.innerHTML=`<tr class="empty-row"><td colspan="4">${tr('noData')}</td></tr>`;} else {staffPerfBody.innerHTML=staffEntries.map(d=>`<tr><td>${escapeHtml(d.label)}</td><td>${d.count}</td><td>${d.sales.toFixed(2)} SAR</td><td><strong>${d.commission.toFixed(2)} SAR</strong></td></tr>`).join('');} const invSearchEl=document.getElementById('invoiceSearchInput'); const invQ=invSearchEl?invSearchEl.value.trim().toLowerCase():''; const searchedInvoices=invQ?filteredInvoices.filter(inv=>{const s=findStaffById(inv.staffId); const sv=findServiceById(inv.serviceId); const staffLabel=(s?staffDisplayName(s):inv.staffName||'').toLowerCase(); const serviceLabel=(sv?serviceDisplayName(sv):inv.serviceName||'').toLowerCase(); return (inv.serial||'').toLowerCase().includes(invQ)||staffLabel.includes(invQ)||serviceLabel.includes(invQ);}):filteredInvoices; const invTableBody=document.getElementById('invoicesTableBody'); if(searchedInvoices.length===0){invTableBody.innerHTML=`<tr class="empty-row"><td colspan="9">${tr('noInvoices')}</td></tr>`;} else {invTableBody.innerHTML=[...searchedInvoices].sort((a,b)=>b.id-a.id).map(inv=>{const s=findStaffById(inv.staffId); const sv=findServiceById(inv.serviceId); const staffLabel=s?staffDisplayName(s):(inv.staffName||'--'); const serviceLabel=sv?serviceDisplayName(sv):(inv.serviceName||'--'); return `<tr><td>${inv.serial}</td><td>${formatDate(inv.date)} (${inv.time||''})</td><td>${escapeHtml(staffLabel)}</td><td>${escapeHtml(serviceLabel)}</td><td>${locationLabel(inv.serviceLocation)}</td><td>${payLabel(inv.pay)}</td><td>${inv.price.toFixed(2)} SAR</td><td>${invoiceCommission(inv).toFixed(2)} SAR</td><td class="action-cell"><button class="btn btn-print" onclick="printInvoiceById(${inv.id})"><i class="fa-solid fa-print"></i></button><button class="btn btn-edit" onclick="openEditModalProtected('invoice',${inv.id})"><i class="fa-solid fa-pen"></i></button><button class="btn btn-danger" onclick="deleteInvoice(${inv.id})"><i class="fa-solid fa-trash"></i></button></td></tr>`;}).join('');}}

function setCashDate(p){const from=document.getElementById('cashFilterFrom'); const to=document.getElementById('cashFilterTo'); if(p==='today'){const t=getLocalDate(); from.value=t; to.value=t; document.getElementById('cashDate').value=t;} else if(p==='month'){const today=new Date(); const start=new Date(today.getFullYear(),today.getMonth(),1); from.value=dateToInputValue(start); to.value=getLocalDate();} renderCash();}
function clearCashFilter(){document.getElementById('cashFilterFrom').value=''; document.getElementById('cashFilterTo').value=''; document.getElementById('cashSearch').value=''; renderCash();}
function sourceLabel(src){const map={bank_transfer:'تحويل بنكي',bank_card:'صرافة (شبكة)',safe_transfer:'خزنة أخرى',staff_commission:'نسب عمالة',expense_payment:'مصروف',other:'أخرى'}; return map[src]||src;}
function getCashFiltered(){const from=document.getElementById('cashFilterFrom').value||''; const to=document.getElementById('cashFilterTo').value||''; const q=(document.getElementById('cashSearch').value||'').toLowerCase(); const inRange=d=>{if(from&&!to) return d===from; if(from&&d<from) return false; if(to&&d>to) return false; return true;}; const trans=cashTransactions.filter(t=>inRange(t.date)&&(!q||(t.note||'').toLowerCase().includes(q))); const invs=invoices.filter(i=>inRange(i.date)); const exps=expenses.filter(e=>inRange(e.date)); return {trans, invoices:invs, expenses:exps};}
async function saveCashTransaction_OLD(e){e.preventDefault(); const now=new Date(); const data={date:document.getElementById('cashDate').value, time:now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}), type:document.getElementById('cashType').value, source:document.getElementById('cashSource').value, amount:Number(document.getElementById('cashAmount').value), note:document.getElementById('cashNote').value}; if(isNaN(data.amount)||data.amount<=0){showToast(tr('invalidAmount'),'error'); return;} let saved=null; try{const {data:res,error}=await _supabase.from('cash_transactions').insert([data]).select(); if(!error&&res&&res[0]){saved=mapCashRow(res[0]); cashTransactions.push(saved);} else throw error;}catch(err){const id=Date.now(); saved={id,...data, created_at:new Date().toISOString()}; cashTransactions.push(saved); localStorage.setItem('haiba_cash_transactions',JSON.stringify(cashTransactions));} document.getElementById('cashForm').reset(); document.getElementById('cashDate').value=getLocalDate(); renderCash(); showToast(tr('savedOk'),'success');}
function deleteCashTransaction(id){ requestManagerAuth(async()=>{ if(!confirm('حذف حركة الخزينة؟')) return; try{await _supabase.from('cash_transactions').delete().eq('id',id);}catch(e){} cashTransactions=cashTransactions.filter(t=>t.id!==id); localStorage.setItem('haiba_cash_transactions',JSON.stringify(cashTransactions)); renderCash(); showToast('تم الحذف','success'); },'حذف حركة الخزينة يتطلب صلاحية المدير'); }
function renderCash(){const {trans, invoices:invR, expenses:expR}=getCashFiltered(); const cashInvoicesTotal=invR.filter(i=>i.pay==='cash').reduce((s,i)=>s+i.price,0); const deposits=trans.filter(t=>t.type==='deposit').reduce((s,t)=>s+t.amount,0); const withdraws=trans.filter(t=>t.type==='withdraw').reduce((s,t)=>s+t.amount,0); const expensesTotal=expR.reduce((s,e)=>s+e.amount,0); let commissionTotal=0; invR.forEach(i=>commissionTotal+=invoiceCommission(i)); const remaining=cashInvoicesTotal+deposits-withdraws-expensesTotal; document.getElementById('cashInvoicesTotal').innerText=cashInvoicesTotal.toFixed(2)+' SAR'; document.getElementById('cashDepositsTotal').innerText=deposits.toFixed(2)+' SAR'; document.getElementById('cashWithdrawsTotal').innerText=withdraws.toFixed(2)+' SAR'; document.getElementById('cashExpensesTotal').innerText=expensesTotal.toFixed(2)+' SAR'; document.getElementById('cashCommissionTotal').innerText=commissionTotal.toFixed(2)+' SAR'; const remEl=document.getElementById('cashRemaining'); remEl.innerText=remaining.toFixed(2)+' SAR'; remEl.className='metric-value '+(remaining>=0?'remaining-positive':'remaining-negative'); const tbody=document.getElementById('cashTableBody'); tbody.innerHTML=''; const sorted=[...trans].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)||a.id-b.id); let running=cashInvoicesTotal; const rowsHtml=[]; rowsHtml.push(`<tr style="background:#F0FDF4; font-weight:800;"><td>${invR.length?formatDate(invR[0]?.date||getLocalDate()):'--'}</td><td><span class="status-pill active">رصيد افتتاحي</span></td><td>فواتير كاش</td><td>إجمالي الكاش المحصل</td><td class="cash-in">${cashInvoicesTotal.toFixed(2)}</td><td>-</td><td><strong>${running.toFixed(2)}</strong></td><td>-</td></tr>`); sorted.forEach(t=>{if(t.type==='deposit'){running+=t.amount; rowsHtml.push(`<tr><td>${formatDate(t.date)} ${t.time||''}</td><td><span class="status-pill active">إيداع ➕</span></td><td>${sourceLabel(t.source)}</td><td>${escapeHtml(t.note)}</td><td class="cash-in">+${t.amount.toFixed(2)}</td><td>-</td><td><strong>${running.toFixed(2)}</strong></td><td><button class="btn btn-danger" onclick="deleteCashTransaction(${t.id})"><i class="fa-solid fa-trash"></i></button></td></tr>`);} else {running-=t.amount; rowsHtml.push(`<tr><td>${formatDate(t.date)} ${t.time||''}</td><td><span class="status-pill inactive">سحب ➖</span></td><td>${sourceLabel(t.source)}</td><td>${escapeHtml(t.note)}</td><td>-</td><td class="cash-out">-${t.amount.toFixed(2)}</td><td><strong>${running.toFixed(2)}</strong></td><td><button class="btn btn-danger" onclick="deleteCashTransaction(${t.id})"><i class="fa-solid fa-trash"></i></button></td></tr>`);}}); if(expensesTotal>0){running-=0; rowsHtml.push(`<tr style="background:#FEF2F2;"><td>${formatDate(expR[0]?.date||getLocalDate())}</td><td><span class="status-pill inactive">مصروفات</span></td><td>مصروفات</td><td>إجمالي المصروفات في الفترة</td><td>-</td><td class="cash-out">-${expensesTotal.toFixed(2)}</td><td><strong>${(cashInvoicesTotal+deposits-withdraws-expensesTotal).toFixed(2)}</strong></td><td>-</td></tr>`);} tbody.innerHTML=rowsHtml.join(''); if(trans.length===0&&invR.length===0) tbody.innerHTML=`<tr class="empty-row"><td colspan="8">${tr('noData')}</td></tr>`;}
function exportCashCsv(){const {trans}=getCashFiltered(); if(!trans.length){showToast(tr('noData'),'info'); return;} const header=['التاريخ','النوع','المصدر','البيان','مدين','دائن','الرصيد']; let running=0; const cashInvoicesTotal=getCashFiltered().invoices.filter(i=>i.pay==='cash').reduce((s,i)=>s+i.price,0); running=cashInvoicesTotal; const rows=[header,['رصيد افتتاحي','إيداع','فواتير كاش','إجمالي الكاش',cashInvoicesTotal,'',running]]; [...trans].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{if(t.type==='deposit') running+=t.amount; else running-=t.amount; rows.push([t.date,t.type==='deposit'?'إيداع':'سحب',sourceLabel(t.source),t.note,t.type==='deposit'?t.amount:'',t.type==='withdraw'?t.amount:'',running]);}); const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n'); const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`cash_ledger_${getLocalDate()}.csv`; a.click(); URL.revokeObjectURL(url);}
function openAdminModal(){document.getElementById('adminModal').classList.add('active'); renderAdminLists();}

async function addStaff(){const nameAr=document.getElementById('newStaffNameAr').value.trim(); const nameEn=document.getElementById('newStaffNameEn').value.trim(); if(!nameAr) return; if(staffList.some(s=>s.name_ar.trim().toLowerCase()===nameAr.toLowerCase())){showToast(tr('duplicateStaff'),'error'); return;} const {data,error}=await _supabase.from('staff').insert([{name_ar:nameAr, name_en:nameEn||null}]).select(); if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} if(data&&data[0]&&!staffList.find(s=>s.id===data[0].id)) staffList.push(mapStaffRow(data[0])); document.getElementById('newStaffNameAr').value=''; document.getElementById('newStaffNameEn').value=''; populateStaffSelect(); populateReportStaffFilter(); renderAdminLists(); showToast(tr('savedOk'),'success');}

async function addService(){const nameAr=document.getElementById('newServiceNameAr').value.trim(); const nameEn=document.getElementById('newServiceNameEn').value.trim(); const price=Number(document.getElementById('newServicePrice').value); if(!nameAr||isNaN(price)||price<0){if(price<0) showToast(tr('invalidAmount'),'error'); return;} if(servicesList.some(s=>s.name_ar.trim().toLowerCase()===nameAr.toLowerCase())){showToast(tr('duplicateService'),'error'); return;} const {data,error}=await _supabase.from('services').insert([{name_ar:nameAr, name_en:nameEn||null, price}]).select(); if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} if(data&&data[0]&&!servicesList.find(s=>s.id===data[0].id)) servicesList.push(mapServiceRow(data[0])); document.getElementById('newServiceNameAr').value=''; document.getElementById('newServiceNameEn').value=''; document.getElementById('newServicePrice').value=''; populateServiceSelect(); renderAdminLists(); showToast(tr('savedOk'),'success');}
function removeService(id){ requestManagerAuth(async()=>{ if(!confirm(tr('confirmDeleteService'))) return; const {error}=await _supabase.from('services').delete().eq('id',id); if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} servicesList=servicesList.filter(s=>s.id!==id); populateServiceSelect(); renderAdminLists(); },'حذف خدمة يتطلب صلاحية المدير'); }
async function toggleStaffActive(id){const staff=findStaffById(id); if(!staff) return; const {data,error}=await _supabase.from('staff').update({active:!staff.active}).eq('id',id).select(); if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} if(data&&data[0]){const index=staffList.findIndex(s=>s.id===id); if(index>-1) staffList[index]=mapStaffRow(data[0]);} populateStaffSelect(); renderAdminLists(); populateReportStaffFilter();}
async function toggleServiceActive(id){const service=findServiceById(id); if(!service) return; const {data,error}=await _supabase.from('services').update({active:!service.active}).eq('id',id).select(); if(error){showToast(tr('cloudSaveError')+error.message,'error'); return;} if(data&&data[0]){const index=servicesList.findIndex(s=>s.id===id); if(index>-1) servicesList[index]=mapServiceRow(data[0]);} populateServiceSelect(); renderAdminLists();}

function renderAdminLists(){const staffTable=document.getElementById('adminStaffList'); staffTable.innerHTML=staffList.map(s=>`<tr><td>${escapeHtml(staffDisplayName(s))}</td><td><span class="status-pill ${s.active?'active':'inactive'}">${tr(s.active?'active':'inactive')}</span></td><td class="action-cell"><button class="btn btn-edit" title="${tr('editBtn')}" onclick="openEditModal('staff',${s.id})"><i class="fa-solid fa-pen"></i></button><button class="btn btn-secondary" onclick="toggleStaffActive(${s.id})">${tr(s.active?'deactivate':'activate')}</button><button class="btn btn-danger" onclick="removeStaff(${s.id})">${tr('deleteBtn')}</button></td></tr>`).join(''); const serviceTable=document.getElementById('adminServiceList'); serviceTable.innerHTML=servicesList.map(sv=>`<tr><td>${escapeHtml(serviceDisplayName(sv))}</td><td>${sv.price} SAR</td><td><span class="status-pill ${sv.active?'active':'inactive'}">${tr(sv.active?'active':'inactive')}</span></td><td class="action-cell"><button class="btn btn-edit" title="${tr('editBtn')}" onclick="openEditModal('service',${sv.id})"><i class="fa-solid fa-pen"></i></button><button class="btn btn-secondary" onclick="toggleServiceActive(${sv.id})">${tr(sv.active?'deactivate':'activate')}</button><button class="btn btn-danger" onclick="removeService(${sv.id})">${tr('deleteBtn')}</button></td></tr>`).join(''); document.getElementById('centerCommissionPercent').value=commissionSettings.centerPercent; document.getElementById('homeDefaultRate').value=commissionSettings.homeDefaultRate; const overrideSelect=document.getElementById('overrideStaffSelect'); overrideSelect.innerHTML=staffList.map(s=>`<option value="${s.id}">${escapeHtml(staffDisplayName(s))}</option>`).join(''); const overridesBody=document.getElementById('overridesListUI'); const entries=Object.entries(commissionSettings.homeOverrides||{}); if(entries.length===0){overridesBody.innerHTML=`<tr class="empty-row"><td colspan="3">${tr('noOverrides')}</td></tr>`;} else {overridesBody.innerHTML=entries.map(([staffId,rate])=>{const s=findStaffById(staffId); return `<tr><td>${escapeHtml(s?staffDisplayName(s):('#'+staffId))}</td><td>${rate} SAR</td><td><button class="btn btn-danger" onclick="removeCommissionOverride('${staffId}')">${tr('deleteBtn')}</button></td></tr>`;}).join('');}}
function escapeHtml(str){return String(str??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function openEditModal(type,id){editContext={type,id}; const body=document.getElementById('editModalBody'); const title=document.getElementById('editModalTitle'); body.innerHTML=''; if(type==='invoice'){const inv=invoices.find(i=>i.id===id); if(!inv) return; title.textContent=tr('editInvoiceTitle')+' - محمي'; body.innerHTML=`<div class="form-group"><label>${tr('invDate')}</label><input type="date" id="ed_date" value="${inv.date}"></div><div class="form-group"><label>${tr('staffName')}</label><select id="ed_staff">${staffList.map(s=>`<option value="${s.id}" ${String(s.id)===String(inv.staffId)?'selected':''}>${escapeHtml(staffDisplayName(s))}</option>`).join('')}</select></div><div class="form-group"><label>${tr('serviceLabel')}</label><select id="ed_service">${servicesList.map(s=>`<option value="${s.id}" data-price="${s.price}" ${String(s.id)===String(inv.serviceId)?'selected':''}>${escapeHtml(serviceDisplayName(s))}</option>`).join('')}</select></div><div class="form-group"><label>${tr('durationLabel')}</label><input type="text" id="ed_duration" value="${escapeHtml(inv.duration)}"></div><div class="form-group"><label>${tr('priceLabel')}</label><input type="number" step="0.01" id="ed_price" value="${inv.price}"></div><div class="form-group"><label>${tr('paymentMethod')}</label><select id="ed_pay"><option value="cash" ${inv.pay==='cash'?'selected':''}>${tr('payCash')}</option><option value="card" ${inv.pay==='card'?'selected':''}>${tr('payCard')}</option><option value="transfer" ${inv.pay==='transfer'?'selected':''}>${tr('payTransfer')}</option></select></div><div class="form-group"><label>${tr('serviceLocation')}</label><select id="ed_location"><option value="in_center" ${inv.serviceLocation==='in_center'?'selected':''}>${tr('locInCenter')}</option><option value="home_visit" ${inv.serviceLocation==='home_visit'?'selected':''}>${tr('locHomeVisit')}</option></select></div>`;} else if(type==='expense'){const ex=expenses.find(e=>e.id===id); if(!ex) return; title.textContent=tr('editExpenseTitle'); body.innerHTML=`<div class="form-group"><label>${tr('expTitleLabel')}</label><input type="text" id="ed_title" value="${escapeHtml(ex.title)}"></div><div class="form-group"><label>${tr('expAmountLabel')}</label><input type="number" step="0.01" id="ed_amount" value="${ex.amount}"></div><div class="form-group"><label>${tr('expDateLabel')}</label><input type="date" id="ed_expdate" value="${ex.date}"></div>`;} else if(type==='staff'){const s=findStaffById(id); if(!s) return; title.textContent=tr('editStaffTitle'); body.innerHTML=`<div class="form-group"><label>${tr('staffNameArPh')}</label><input type="text" id="ed_name_ar" value="${escapeHtml(s.name_ar)}"></div><div class="form-group"><label>${tr('staffNameEnPh')}</label><input type="text" id="ed_name_en" value="${escapeHtml(s.name_en)}"></div>`;} else if(type==='service'){const s=findServiceById(id); if(!s) return; title.textContent=tr('editServiceTitle'); body.innerHTML=`<div class="form-group"><label>${tr('serviceNameArPh')}</label><input type="text" id="ed_sname_ar" value="${escapeHtml(s.name_ar)}"></div><div class="form-group"><label>${tr('serviceNameEnPh')}</label><input type="text" id="ed_sname_en" value="${escapeHtml(s.name_en)}"></div><div class="form-group"><label>${tr('priceLabel')}</label><input type="number" step="0.01" id="ed_sprice" value="${s.price}"></div>`;} document.getElementById('editModal').classList.add('active');}

let adminMoved = false;
function openManagerForAdmin(){
    pendingManagerAction = () => openAdminDashboard();
    const m = document.getElementById('managerModal');
    const inp = document.getElementById('managerPasswordInput');
    const err = document.getElementById('managerError');
    if(m) m.classList.add('active');
    if(inp){ inp.value=''; setTimeout(()=>inp.focus(),100); }
    if(err) err.style.display='none';
}
function openAdminDashboard(){
    const reportsEl = document.getElementById('reports');
    const cashEl = document.getElementById('cash');
    const expensesEl = document.getElementById('expenses');
    const pR = document.getElementById('admin-panel-reports');
    const pC = document.getElementById('admin-panel-cash');
    const pE = document.getElementById('admin-panel-expenses');
    const pS = document.getElementById('admin-panel-settings');
    
    if(!adminMoved){
        if(reportsEl && pR) pR.appendChild(reportsEl);
        if(cashEl && pC) pC.appendChild(cashEl);
        if(expensesEl && pE) pE.appendChild(expensesEl);
        const settingsSrc = document.querySelector('#adminModal .modal-content');
        if(settingsSrc && pS) pS.innerHTML = settingsSrc.innerHTML;
        adminMoved = true;
    }
    [reportsEl, cashEl, expensesEl].forEach(el=>{ if(el){ el.style.display='block'; el.classList.add('active'); } });
    document.getElementById('adminDashboardModal').classList.add('active');
    switchAdminTab('reports');
    setTimeout(()=>{ try{renderReports();}catch(e){} try{renderCash();}catch(e){} try{renderExpenses();}catch(e){} try{if(typeof renderAdminLists==='function') renderAdminLists();}catch(e){} },200);
}
function closeAdminDashboard(){ document.getElementById('adminDashboardModal').classList.remove('active'); }
function switchAdminTab(tab){
    document.querySelectorAll('.admin-tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.admin-tab-panel').forEach(p=>p.classList.remove('active'));
    const b = document.getElementById('admin-btn-'+tab);
    if(b) b.classList.add('active');
    const p = document.getElementById('admin-panel-'+tab);
    if(p) p.classList.add('active');
    try{
        if(tab==='reports' && typeof renderReports==='function') renderReports();
        if(tab==='cash' && typeof renderCash==='function') renderCash();
        if(tab==='expenses' && typeof renderExpenses==='function') renderExpenses();
        if(tab==='settings' && typeof renderAdminLists==='function') renderAdminLists();
    }catch(e){}
}
function updateLivePreviewPro(){
    try{
        const serial = document.getElementById('invSerial')?.value || 'INV-00001';
        const dateVal = document.getElementById('invDateInput')?.value || getLocalDate();
        const staffSel = document.getElementById('staffSelect');
        const serviceSel = document.getElementById('serviceSelect');
        const staffName = staffSel?.options[staffSel.selectedIndex]?.textContent || '--';
        const serviceName = serviceSel?.options[serviceSel.selectedIndex]?.textContent || '--';
        const duration = document.getElementById('duration')?.value || '--';
        const price = document.getElementById('price')?.value || '0';
        const loc = document.getElementById('serviceLocation')?.value || 'in_center';
        const pay = document.getElementById('paymentMethod')?.value || 'cash';
        const timeNow = new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
        const g = (id,t)=>{ const e=document.getElementById(id); if(e) e.textContent=t; };
        g('r-serial', serial);
        g('r-date', formatDate(dateVal));
        g('r-date2', formatDate(dateVal));
        g('r-time', timeNow);
        g('r-staff', staffName);
        g('r-service', serviceName);
        g('r-duration', duration?`${duration} ${tr('minutes')}`:'--');
        g('r-type', locationLabel(loc));
        g('r-pay', payLabel(pay));
        g('r-price', `${Number(price||0).toFixed(2)} ${currentLang==='ar'?'ر.س':'SAR'}`);
        g('barcodeText', serial);
        try{
            const svg=document.getElementById('barcodeSvg');
            if(svg && typeof JsBarcode!=='undefined' && serial){
                JsBarcode(svg, String(serial), {format:'CODE128', displayValue:false, width:1.4, height:32, margin:0});
            }
        }catch(e){}
    }catch(e){}
}
